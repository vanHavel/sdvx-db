<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description"
    content="Search and filter all Sound Voltex charts by title, composer, effector, difficulty, level, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/main.css" />
  <script type="module" src="/src/main.ts"></script>
  <title>SDVX Chart Database</title>
</head>

<body>
  <div id="app">
    <header id="site-header">
      <h1>SDVX コナステ Chart Database</h1>
      <a id="github-link" href="https://github.com/vanhavel/sdvx-db" target="_blank" rel="noopener"
        aria-label="GitHub repository">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" fill="currentColor">
          <path
            d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z">
          </path>
        </svg>
      </a>
    </header>

    <section id="search-panel" aria-labelledby="search-heading">
      <h2 id="search-heading">Search Charts</h2>
      <form id="search-form" onsubmit="return false;">
        <div class="search-row">
          <div class="search-field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Search by title..." />
          </div>
          <div class="search-field">
            <label for="artist">Composer</label>
            <input type="text" id="artist" name="artist" placeholder="Search by composer..." />
          </div>
          <div class="search-field">
            <label for="effector">Effector</label>
            <input type="text" id="effector" name="effector" placeholder="Search by effector..." />
          </div>
        </div>

        <div class="search-row">
          <div class="search-field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="">All</option>
              <option value="0">Novice</option>
              <option value="1">Advanced</option>
              <option value="2">Exhaust</option>
              <option value="3">Infinite</option>
              <option value="4">Gravity</option>
              <option value="5">Heavenly</option>
              <option value="6">Vivid</option>
              <option value="7">Exceed</option>
              <option value="8">Maximum</option>
            </select>
          </div>
          <div class="search-field">
            <label for="level">Level</label>
            <select id="level" name="level">
              <option value="">All</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
              <option value="9">9</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
            </select>
          </div>
          <div class="search-field">
            <label for="source-version">Version</label>
            <select id="source-version" name="source-version">
              <option value="">All</option>
              <option value="0">BOOTH</option>
              <option value="1">Infinite Infection</option>
              <option value="2">Gravity Wars</option>
              <option value="3">Heavenly Haven</option>
              <option value="4">Vivid Wave</option>
              <option value="5">Exceed Gear</option>
            </select>
          </div>
        </div>

        <div class="search-row">
          <div class="search-field">
            <label for="unlock-source">Unlock</label>
            <select id="unlock-source" name="unlock-source">
              <option value="">All</option>
              <option value="default">Default</option>
              <option value="blaster_gate">Blaster Gate</option>
              <optgroup label="Song Packs"></optgroup>
            </select>
          </div>
          <div class="search-field">
            <label for="order">Order By</label>
            <select id="order" name="order">
              <option value="title">Title</option>
              <option value="release_date">Release Date</option>
              <option value="bpm">BPM</option>
            </select>
          </div>
          <div class="search-field search-actions">
            <button type="button" id="sort-direction" class="sort-toggle" title="Toggle sort direction"
              data-direction="asc" aria-label="Sort ascending"></button>
            <button type="button" id="search" class="search-button">Search</button>
          </div>
        </div>
      </form>
    </section>

    <div id="meta-bar">
      <span class="last-updated" id="last-updated-label">Last updated: 2025-04-25</span>
    </div>

    <section id="results-section" aria-live="polite">
      <div id="results"></div>
    </section>

    <nav id="pagination" aria-label="Search results navigation">
      <button type="button" id="first-page" disabled>&#x276E;&#x276E;</button>
      <button type="button" id="prev-page" disabled>&#x276E;</button>
      <span id="page-info">
        Showing <span id="first-offset">1</span> to
        <span id="last-offset">20</span> of <span id="total-count">0</span>
      </span>
      <button type="button" id="next-page" disabled>&#x276F;</button>
      <button type="button" id="last-page" disabled>&#x276F;&#x276F;</button>
    </nav>

    <footer id="site-footer"></footer>
  </div>
</body>

</html>
